<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="c593d8b67cff96c27825413bc43c683930dbaff396a3ea10fa7de581fbd9eec5">
  <title id="title">How Handy turns a meeting into working context</title>
  <desc id="description">A three-stage view of Handy: meeting inputs enter a routed live agent loop, become shared in-room artifacts, and leave as reusable exports. DataHub metadata supplies data context.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57534e"/></marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive; }
      .title { font-size: 36px; fill: #292524; }
      .subtitle { font-size: 17px; fill: #78716c; }
      .zone-label { font-size: 14px; letter-spacing: 1px; }
      .node-title { font-size: 20px; fill: #292524; }
      .node-body { font-size: 15px; fill: #44403c; }
      .node-note { font-size: 13px; fill: #57534e; }
      .edge-label { font-size: 13px; fill: #57534e; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
      .footer { font-size: 13px; fill: #57534e; }
      .arrow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="54" y="62" class="title">How Handy turns a meeting into working context</text>
  <text x="54" y="94" class="subtitle">Conversation becomes evidence, prototypes, decisions, and a reusable meeting package while the room is still live</text>
  <rect data-zone-id="inputs" x="42.0" y="130" width="396.3" height="690" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62.0" y="160" class="zone-label" fill="#1e40af">1 · WHAT ENTERS THE ROOM</text>
  <rect data-zone-id="loop" x="466.3" y="130" width="563.1" height="690" rx="28" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="486.3" y="160" class="zone-label" fill="#5b21b6">2 · THE LIVE AGENT LOOP</text>
  <rect data-zone-id="outcomes" x="1057.4" y="130" width="500.6" height="690" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1077.4" y="160" class="zone-label" fill="#166534">3 · WHAT THE ROOM GETS</text>
  <path class="arrow" data-edge="conversation--router" d="M408.3 258.0 C439.1 258.0 465.5 258.0 496.3 258.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="files--router" d="M408.3 408.0 H452.3 V258.0 H496.3" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="datahub--router" d="M408.3 558.0 H452.3 V258.0 H496.3" stroke="#d97706" marker-end="url(#arrow-amber)" stroke-dasharray="7 6"/>
  <path class="arrow" data-edge="router--understand" d="M747.9 315.0 V352.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="router--build" d="M747.9 315.0 V502.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="understand--room" d="M999.4 408.0 H1043.4 V258.0 H1087.4" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="build--room" d="M999.4 558.0 H1043.4 V258.0 H1087.4" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="room--recap" d="M1307.7 315.0 V477.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="room--build" d="M1528.0 258.0 H1546.0 V806.0 H478.3 V558.0 H496.3" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <rect class="node" data-node-id="conversation" data-status="external" x="72.0" y="177.0" width="336.3" height="162.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240.1" y="212.0" text-anchor="middle" class="node-title">People speak and share the</text>
  <text x="240.1" y="238.0" text-anchor="middle" class="node-title">screen</text>
  <text x="240.1" y="269.0" text-anchor="middle" class="node-body">live transcript · optional screen</text>
  <text x="240.1" y="291.0" text-anchor="middle" class="node-body">frame</text>
  <text x="240.1" y="321.0" text-anchor="middle" class="node-note">Raw frames stay on the meeting server</text>
  <rect class="node" data-node-id="files" data-status="implemented" x="72.0" y="338.0" width="336.3" height="140.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240.1" y="373.0" text-anchor="middle" class="node-title">The host accepts useful</text>
  <text x="240.1" y="399.0" text-anchor="middle" class="node-title">files</text>
  <text x="240.1" y="430.0" text-anchor="middle" class="node-body">research · specs · workspace context</text>
  <text x="240.1" y="460.0" text-anchor="middle" class="node-note">Guest uploads wait for host review</text>
  <rect class="node" data-node-id="datahub" data-status="planned" x="72.0" y="502.0" width="336.3" height="112.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="240.1" y="537.0" text-anchor="middle" class="node-title">DataHub adds data meaning</text>
  <text x="240.1" y="568.0" text-anchor="middle" class="node-body">schemas · lineage · owners · quality</text>
  <rect class="node" data-node-id="router" data-status="implemented" x="496.3" y="201.0" width="503.1" height="114.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="747.9" y="236.0" text-anchor="middle" class="node-title">A router decides what matters now</text>
  <text x="747.9" y="267.0" text-anchor="middle" class="node-body">recent transcript + summary + accepted context</text>
  <text x="747.9" y="297.0" text-anchor="middle" class="node-note">Heavy agents do not run on every utterance</text>
  <rect class="node" data-node-id="understand" data-status="implemented" x="496.3" y="352.0" width="503.1" height="112.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="747.9" y="387.0" text-anchor="middle" class="node-title">Agents structure and check the discussion</text>
  <text x="747.9" y="418.0" text-anchor="middle" class="node-body">rolling decisions · owners · open questions</text>
  <text x="747.9" y="440.0" text-anchor="middle" class="node-body">retrieved evidence when search is configured</text>
  <rect class="node" data-node-id="build" data-status="implemented" x="496.3" y="502.0" width="503.1" height="112.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="747.9" y="537.0" text-anchor="middle" class="node-title">The idea becomes a live prototype</text>
  <text x="747.9" y="568.0" text-anchor="middle" class="node-body">streamed HTML · review · next-step edits</text>
  <text x="747.9" y="590.0" text-anchor="middle" class="node-body">the chosen style becomes Design DNA</text>
  <rect class="node" data-node-id="room" data-status="implemented" x="1087.4" y="201.0" width="440.6" height="114.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1307.7" y="236.0" text-anchor="middle" class="node-title">Everyone sees one shared live room</text>
  <text x="1307.7" y="267.0" text-anchor="middle" class="node-body">transcript · evidence · prototypes · presence</text>
  <text x="1307.7" y="297.0" text-anchor="middle" class="node-note">Settled events replay for late joiners</text>
  <rect class="node" data-node-id="recap" data-status="implemented" x="1087.4" y="477.0" width="440.6" height="162.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1307.7" y="512.0" text-anchor="middle" class="node-title">The meeting leaves a reusable</text>
  <text x="1307.7" y="538.0" text-anchor="middle" class="node-title">package</text>
  <text x="1307.7" y="569.0" text-anchor="middle" class="node-body">recap · transcript · summary</text>
  <text x="1307.7" y="591.0" text-anchor="middle" class="node-body">prototypes · DESIGN.md · manifest</text>
  <text x="1307.7" y="621.0" text-anchor="middle" class="node-note">Saved under the host export folder</text>
</svg>
