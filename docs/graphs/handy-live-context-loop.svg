<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="69f9204dad3a3bce1bd532b83a532f449fca697aa819d5240a063a2693dfec00">
  <title id="title">How DataHub becomes live meeting context</title>
  <desc id="description">DataHub company memory and live meeting signals form one changing shared context. All Handy agents read that context, create grounded work, assess known impact, and return structured meeting knowledge.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
